name: Sync and deploy

on:
  push:
    branches: [main]
  schedule:
    # Once a day at 00:00 UTC. Runs on the hour can start late when
    # GitHub's scheduler is busy.
    - cron: '0 0 * * *'
  workflow_dispatch:

# main is protected: changes land through pull requests (see ci.yml). The
# sync pushes its data commit with a deploy key (secret SYNC_DEPLOY_KEY),
# which is on the ruleset's bypass list. A deploy-key push would start this
# workflow again, so the commit carries [skip ci] and this run deploys the
# synced data itself.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.SYNC_DEPLOY_KEY }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # A source that is down keeps its old snapshot and the step still
      # succeeds; details are written to the job summary. When every source
      # was fetched, the sync also rebuilds the model list (data/models.json).
      # It also records today's ratings in data/history.jsonl
      # (changelogConfig.recordHistory).
      - name: Sync the model list, snapshots and history
        if: github.event_name != 'push'
        run: pnpm sync
        env:
          AA_API_KEY: ${{ secrets.AA_API_KEY }}

      - name: Lint and check formatting
        run: pnpm exec biome ci .

      - name: Check for comments
        run: pnpm lint:comments

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # The build only reads local files; it never goes online.
      - name: Build
        run: pnpm build

      # Only data that passed the checks above reaches main.
      - name: Commit the changed model list, snapshots and history
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data/models.json data/snapshots data/history.jsonl)" ]; then
            echo "Model list, snapshots and history unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models.json data/snapshots data/history.jsonl
          git commit -m "chore(data): sync snapshots" -m "[skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Browser smoke test of the exact site that was built. It is optional: it
  # runs next to the deploy, never blocks it, and a failure only marks this
  # job red.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: github-pages
          path: ${{ runner.temp }}/site

      - name: Unpack the built site
        run: mkdir -p dist && tar -xf "${RUNNER_TEMP}/site/artifact.tar" -C dist

      # No --with-deps: see the same step in ci.yml.
      - name: Install Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Smoke test
        run: pnpm smoke

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-traces
          path: test-results
          retention-days: 7
