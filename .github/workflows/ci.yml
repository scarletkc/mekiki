name: CI

# Checks every pull request into main. The ruleset on main requires the
# `check` job to pass on a branch that is up to date with main, so keep the
# job id stable (and add no path filters, or the check never reports).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and check formatting
        run: pnpm exec biome ci .

      - name: Check for comments
        run: pnpm lint:comments

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test

      # Tests the committed data; the sync runs only in deploy.yml.
      - name: Build
        run: pnpm build

      # No --with-deps: the runner already has the libraries, and the flag
      # only adds fonts through apt, which hangs when the mirrors are down.
      - name: Install Chromium
        run: pnpm exec playwright install --only-shell chromium

      - name: Smoke test
        run: pnpm smoke

      - name: Upload traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-traces
          path: test-results
          retention-days: 7
